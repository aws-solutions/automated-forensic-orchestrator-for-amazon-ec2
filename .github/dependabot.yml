# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Until this file existed, the repository had no version updates at all. The only
# Dependabot pull requests it could receive were *security* updates, which fire
# solely in response to an open vulnerability alert -- so once #52 refreshed the
# dependency tree and every alert moved to `fixed`, dependency PRs stopped
# entirely. Nothing proposed routine bumps in between.
#
# Conventions here follow the sibling repository
# guidance-for-game-backend-and-infrastructure-agentic-workflows, with two
# deliberate differences noted at the bottom of this file.

version: 2
updates:
  # Python runtime dependencies for the Lambda functions.
  #
  # This project compiles its pins: `requirements.in` is the input and
  # `requirements.txt` is generated by pip-compile (the header in the .txt records
  # the exact command). The `pip` ecosystem understands that layout -- it edits the
  # .in and regenerates the .txt -- so both files stay consistent. Do not switch
  # this to a bare requirements.txt-only setup; the .txt is generated and would be
  # overwritten on the next `pip-compile`.
  #
  # Review note: lambda/requirements.in feeds the shared Lambda dependency layer,
  # which has a hard 262144000 byte unzipped limit. A bump that pulls in new
  # transitive weight can break the build for reasons unrelated to the package
  # itself, so check layer size on anything that grows the tree.
  - package-ecosystem: "pip"
    directory: "/source/lambda"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group minor and patch together; majors stay separate so they get reviewed
    # one at a time.
    groups:
      lambda-runtime-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Transitive updates matter here: most of the security PRs this repository has
    # received were for indirect dependencies (fast-uri, brace-expansion, idna).
    allow:
      - dependency-type: "all"
    rebase-strategy: "auto"

  # Python test, lint and security tooling. Kept out of the Lambda layer, so this
  # is a separate manifest pair (requirements-test.in -> requirements-test.txt)
  # rather than a second section of the runtime one.
  - package-ecosystem: "pip"
    directory: "/source"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      test-tooling-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    allow:
      - dependency-type: "all"
    rebase-strategy: "auto"

  # npm dependencies for the CDK application.
  - package-ecosystem: "npm"
    directory: "/source"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"
    # aws-cdk-lib alone publishes several releases a week. Without grouping, that
    # one package would consume the PR budget and crowd out everything else.
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    allow:
      - dependency-type: "all"
    rebase-strategy: "auto"

  # GitHub Actions. Newly relevant: .github/workflows/ci.yml arrived in #52, and
  # nothing else tracks the actions it references.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      # No `include: scope` here: the prefix already names the area, and combining
      # the two produces a doubled "chore(ci)(deps)" subject.
      prefix: "chore(ci)"

# Two deliberate differences from the sibling repository's configuration, so that
# anyone comparing the two files knows they were choices rather than omissions:
#
# 1. No `reviewers:` key. GitHub has deprecated `reviewers` and `assignees` in
#    dependabot.yml in favour of CODEOWNERS. It is already inert in practice: on
#    the sibling repository, whose configuration does set it, Dependabot's own pull
#    requests carry no requested reviewers and no requested teams. Adding a
#    CODEOWNERS file is the way to route these for review, and is worth doing
#    separately -- this repository has none today.
#
# 2. `commit-message.prefix` is "chore", not "chore(deps)". With
#    `include: "scope"`, Dependabot appends the scope itself, so a "chore(deps)"
#    prefix yields subjects like "chore(deps)(deps): Bump ...". Using "chore" gives
#    the intended "chore(deps):" and "chore(deps-dev):".
#
# Labels are limited to those this repository already defines (`dependencies`,
# `python`, `javascript`): Dependabot does not create missing labels, and naming
# one that does not exist makes the update job error. If `npm`, `security`,
# `github-actions` or `ci-cd` labels are wanted, create them in repository
# settings first, then add them here.
