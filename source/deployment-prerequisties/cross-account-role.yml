AWSTemplateFormatVersion: 2010-09-09
Description: >-
    Trust and permissions that let the Automated Forensics Orchestrator reach the
    instances in this account. Deploy this in every account whose instances may be
    investigated - including the forensic account itself if instances there are in
    scope, because the Lambdas assume this role even when the two accounts are the
    same one.
Parameters:
    # No defaults on the two account/region parameters. They used to default to
    # 123456789012 and us-west-2, and the region default is not a harmless
    # placeholder: it is interpolated into this role's trust policy, so leaving it
    # produced a policy naming triage-us-west-2-Role, and the stack rolled back
    # with "Invalid principal in policy" - which names neither the parameter nor
    # the region. Requiring both makes the deploy fail up front, with the
    # parameter name, instead of after four resources have been created.
    solutionInstalledAccount:
        Type: String
        AllowedPattern: '^[0-9]{12}$'
        ConstraintDescription: must be a 12 digit AWS account ID
        Description: >-
            Account ID the forensic solution is deployed in. This is the same as
            this account for a single-account deployment.
    solutionAccountRegion:
        Type: String
        AllowedPattern: '^[a-z]{2}(-gov)?-[a-z]+-[0-9]$'
        ConstraintDescription: must be an AWS region such as us-east-1
        Description: >-
            Region the forensic solution is deployed in. Must match it exactly:
            the solution's Lambda role names are region suffixed and are named in
            this role's trust policy.
    kmsKey:
        Type: String
        Default: ''
        AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/.+$'
        ConstraintDescription: must be empty or a KMS key ARN
        Description: >-
            Optional. ARN of the CMK that encrypts EBS volumes in this account, so
            the forensic account can copy their snapshots. Leave empty if volumes
            use the AWS managed key. The previous default was a placeholder ARN in
            an account that does not exist, which granted nothing.

Conditions:
    HasKmsKey: !Not [!Equals [!Ref kmsKey, '']]

Resources:
    forensicAlias:
        Type: 'AWS::KMS::Alias'
        Properties:
            AliasName: alias/forensickey
            TargetKeyId: !Ref forensickey
    forensickey:
        Type: 'AWS::KMS::Key'
        Properties:
            Description: An example symmetric encryption KMS key
            EnableKeyRotation: true
            PendingWindowInDays: 20
            KeyPolicy:
                Version: 2012-10-17
                Id: key-default-1
                Statement:
                    - Sid: Enable IAM User Permissions
                      Effect: Allow
                      Principal:
                          AWS:
                              - !Join
                                - ''
                                - - 'arn:aws:iam::'
                                  - !Ref AWS::AccountId
                                  - ':root'
                      # The AWS-recommended default key policy: it delegates
                      # control of the key to IAM in this account rather than
                      # granting anyone access directly, and without it the key
                      # can become unmanageable. Production deployments that want
                      # least privilege should replace this with the specific KMS
                      # actions each administrative principal needs - and should
                      # not copy 'kms:*' onto any principal other than the
                      # account root, where it is a recovery path rather than a
                      # grant of access.
                      Action: 'kms:*'
                      Resource: '*'
                    - Sid: Allow administration of the key
                      Effect: Allow
                      Principal:
                          AWS:
                              - !Join
                                - ''
                                - - 'arn:aws:iam::'
                                  - !Ref AWS::AccountId
                                  - ':root'
                              - !Join
                                - ''
                                - - 'arn:aws:iam::'
                                  - !Ref solutionInstalledAccount
                                  - ':root'
                      Action:
                          - 'kms:Create*'
                          - 'kms:Describe*'
                          - 'kms:Enable*'
                          - 'kms:List*'
                          - 'kms:Put*'
                          - 'kms:Update*'
                          - 'kms:Revoke*'
                          - 'kms:Disable*'
                          - 'kms:Get*'
                          - 'kms:Delete*'
                          - 'kms:ScheduleKeyDeletion'
                          - 'kms:CancelKeyDeletion'
                      Resource: '*'
    ForensicAppAccountKMSPolicyFDC5F105:
        Type: AWS::IAM::Policy
        Properties:
            PolicyDocument:
                Statement:
                    - Action:
                          - kms:Encrypt
                          - kms:Decrypt
                          - kms:ReEncrypt*
                          - kms:GenerateDataKey*
                          - kms:DescribeKey
                      Effect: Allow
                      Resource: !GetAtt forensickey.Arn
                    - Action:
                          - kms:CreateGrant
                      Effect: Allow
                      Resource: '*'
                      Condition:
                          Bool:
                              kms:GrantIsForAWSResource: true
                Version: '2012-10-17'
            PolicyName: ForensicCrossAppAccountKMSFDC5F105
            Roles:
                - Ref: ForensicCrossAccountRole256E0D71
        
    IAMIsolationRole:
      Type: "AWS::IAM::Role"
      Properties:
        RoleName: 'IAMIsolationIAMRole'
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            -
              Effect: "Allow"
              Principal:
                Service:
                  - "ec2.amazonaws.com"
              Action:
                - "sts:AssumeRole"
        Path: "/"
        ManagedPolicyArns:
          - "arn:aws:iam::aws:policy/AWSDenyAll"

    ForensicIsolationInstanceProfile:
      Type: "AWS::IAM::InstanceProfile"
      Properties:
        InstanceProfileName: 'ForensicIsolationInstanceProfile'
        Path: "/"
        Roles:
          - !Ref IAMIsolationRole

    ForensicCrossAccountRole256E0D71:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Statement:
                    - Action: sts:AssumeRole
                      Effect: Allow
                      Principal:
                          AWS:
                              - !Sub
                                - arn:aws:iam::${TARGET_ACCOUNT}:role/triage-${TARGET_REGION}-Role
                                - {
                                      TARGET_ACCOUNT: !Ref solutionInstalledAccount,
                                      TARGET_REGION: !Ref solutionAccountRegion,
                                  }
                              - !Sub
                                - arn:aws:iam::${TARGET_ACCOUNT}:role/shareSnapShot-${TARGET_REGION}-Role
                                - {
                                      TARGET_ACCOUNT: !Ref solutionInstalledAccount,
                                      TARGET_REGION: !Ref solutionAccountRegion,
                                  }
                              - !Sub
                                - arn:aws:iam::${TARGET_ACCOUNT}:role/memoryAcquisition-${TARGET_REGION}-Role
                                - {
                                      TARGET_ACCOUNT: !Ref solutionInstalledAccount,
                                      TARGET_REGION: !Ref solutionAccountRegion,
                                  }
                              - !Sub
                                - arn:aws:iam::${TARGET_ACCOUNT}:role/checkMemoryAcquisition-${TARGET_REGION}-Role
                                - {
                                      TARGET_ACCOUNT: !Ref solutionInstalledAccount,
                                      TARGET_REGION: !Ref solutionAccountRegion,
                                  }
                              - !Sub
                                - arn:aws:iam::${TARGET_ACCOUNT}:role/isolateForensicEc2Instance-${TARGET_REGION}-Role
                                - {
                                      TARGET_ACCOUNT: !Ref solutionInstalledAccount,
                                      TARGET_REGION: !Ref solutionAccountRegion,
                                  }
                              - !Sub
                                - arn:aws:iam::${TARGET_ACCOUNT}:role/performInstanceSnapshot-${TARGET_REGION}-Role
                                - {
                                      TARGET_ACCOUNT: !Ref solutionInstalledAccount,
                                      TARGET_REGION: !Ref solutionAccountRegion,
                                  }
                              - !Sub
                                - arn:aws:iam::${TARGET_ACCOUNT}:role/checkSnapShotStatus-${TARGET_REGION}-Role
                                - {
                                      TARGET_ACCOUNT: !Ref solutionInstalledAccount,
                                      TARGET_REGION: !Ref solutionAccountRegion,
                                  }
                              - !Sub
                                - arn:aws:iam::${TARGET_ACCOUNT}:role/isolateForensicEc2Instance-${TARGET_REGION}-Role
                                - {
                                      TARGET_ACCOUNT: !Ref solutionInstalledAccount,
                                      TARGET_REGION: !Ref solutionAccountRegion,
                                  }
                              - !Sub
                                - arn:aws:iam::${TARGET_ACCOUNT}:role/snapshotCopy-${TARGET_REGION}-Role
                                - {
                                      TARGET_ACCOUNT: !Ref solutionInstalledAccount,
                                      TARGET_REGION: !Ref solutionAccountRegion,
                                  }
                              - !Sub
                                - arn:aws:iam::${TARGET_ACCOUNT}:role/snapshotCopyChecker-${TARGET_REGION}-Role
                                - {
                                      TARGET_ACCOUNT: !Ref solutionInstalledAccount,
                                      TARGET_REGION: !Ref solutionAccountRegion,
                                  }

                Version: '2012-10-17'
            RoleName: !Join
                - ''
                - - 'ForensicEc2AllowAccessRole-'
                  - !Ref 'AWS::Region'

    ForensicCrossAccountRoleDefaultPolicyFDC5F105:
        Type: AWS::IAM::Policy
        Properties:
            PolicyDocument:
                Statement:
                    - Effect: Allow
                      Action: iam:PassRole
                      Resource:
                        - !GetAtt
                            - IAMIsolationRole
                            - Arn
                    - Action:
                          - ec2:CreateSnapshots
                          - ec2:CreateSnapshot
                          - ec2:CreateTags
                          - ec2:CreateSecurityGroup
                          - ec2:CopySnapshot
                          - ec2:ModifySnapshotAttribute
                          - ec2:CreateSecurityGroup
                          - ec2:AuthorizeSecurityGroupIngress
                          - ec2:RevokeSecurityGroupIngress
                          - ec2:AuthorizeSecurityGroupEgress
                          - ec2:RevokeSecurityGroupEgress
                          - ec2:ModifySecurityGroupRules
                          - ec2:UpdateSecurityGroupRuleDescriptionsIngress
                          - ec2:UpdateSecurityGroupRuleDescriptionsEgress
                          - ec2:ModifySecurityGroupRules
                          - ec2:ModifyNetworkInterfaceAttribute
                          - ec2:ModifyInstanceAttribute
                          - ec2:AssociateIamInstanceProfile
                          - ec2:DescribeIamInstanceProfileAssociations
                          - ec2:ReplaceIamInstanceProfileAssociation
                          - ec2:DescribeAddresses
                          - ec2:DisassociateAddress
                          - iam:GetInstanceProfile
                          # iam:PutRolePolicy is a privilege-escalation-capable
                          # action and is deliberately unscoped, because the role
                          # it must modify is the instance profile role of
                          # whichever instance turns out to be compromised. That
                          # role is not known when this template is deployed, and
                          # IAM has no condition key for the inline policy name,
                          # so there is nothing to scope it to.
                          #
                          # What it is used for: attaching a deny-all inline
                          # policy to the compromised instance's role, which
                          # revokes that instance's AWS access without waiting
                          # for its credentials to expire. Removing this
                          # permission removes that containment step.
                          #
                          # Residual risk, stated plainly: a principal that can
                          # assume this role can write an inline policy onto any
                          # role in the application account. Restrict who may
                          # assume ForensicCrossAccountRole accordingly, and
                          # alert on PutRolePolicy in CloudTrail.
                          - iam:PutRolePolicy
                          - eks:CreateAccessEntry
                          - eks:DescribeCluster
                          - eks:UpdateClusterConfig
                          - eks:AssociateAccessPolicy
                          - eks:ListAccessEntries
                      Effect: Allow
                      Resource: '*'
                Version: '2012-10-17'
            PolicyName: ForensicCrossAccountRoleDefaultPolicyFDC5F105
            Roles:
                - Ref: ForensicCrossAccountRole256E0D71
    ForensicCrossAccountKMSPolicyFDC5F105:
        Type: AWS::IAM::Policy
        Properties:
            PolicyDocument:
                Statement:
                    # Omitted entirely when no CMK is supplied. An IAM statement
                    # with an empty Resource is rejected, so the parameter cannot
                    # simply default to ''.
                    - !If
                      - HasKmsKey
                      - Action:
                            - kms:Encrypt
                            - kms:Decrypt
                            - kms:ReEncrypt*
                            - kms:GenerateDataKey*
                            - kms:DescribeKey
                        Effect: Allow
                        Resource: !Ref kmsKey
                      - !Ref 'AWS::NoValue'
                    - Action:
                          - kms:CreateGrant
                      Effect: Allow
                      Resource: '*'
                      Condition:
                          Bool:
                              kms:GrantIsForAWSResource: true
                Version: '2012-10-17'
            PolicyName: ForensicCrossAccountKMSFDC5F105
            Roles:
                - Ref: ForensicCrossAccountRole256E0D71

    ForensicCrossAccountReadOnlyPolicy:
        Type: AWS::IAM::Policy
        Properties:
            PolicyDocument:
                Statement:
                    - Action:
                          - ec2:Describe*
                          - iam:Get*
                          - iam:List*
                      Effect: Allow
                      Resource: '*'
                Version: '2012-10-17'
            PolicyName: ForensicCrossAccountReadOnlyPolicy
            Roles:
                - Ref: ForensicCrossAccountRole256E0D71

    ForensicCrossAccountSSMPolicy:
        Type: AWS::IAM::Policy
        Properties:
            PolicyDocument:
                Statement:
                    - Action:
                          - 'ssm:ListDocuments'
                          - 'ssm:ListDocumentVersions'
                          - 'ssm:DescribeDocument'
                          - 'ssm:GetDocument'
                          - 'ssm:DescribeInstanceInformation'
                          - 'ssm:DescribeDocumentParameters'
                          - 'ssm:DescribeInstanceProperties'
                          - 'ssm:ListCommands'
                          - 'ssm:ListCommandInvocations'
                          - 'ssm:DescribeAutomationExecutions'
                          - 'ssm:GetDocument'
                          - 'ssm:GetCommandInvocation'
                      Effect: Allow
                      Resource: '*'
                Version: '2012-10-17'
            PolicyName: ForensicCrossAccountSSMPolicy
            Roles:
                - Ref: ForensicCrossAccountRole256E0D71

    ForensicCrossAccountSSMRunPolicy:
        Type: AWS::IAM::Policy
        Properties:
            PolicyDocument:
                Statement:
                    # ssm:SendCommand authorises the document and the instances
                    # separately, so the two are scoped separately here.
                    #
                    # Documents: only those owned by the forensic account. This
                    # is the half that can be scoped, and it is the half that
                    # matters - it stops this role running an arbitrary document
                    # such as AWS-RunShellScript, which would be remote code
                    # execution on any instance in the application account.
                    - Sid: RunOnlyForensicDocuments
                      Action:
                          - 'ssm:SendCommand'
                          - 'ssm:StartAutomationExecution'
                      Effect: Allow
                      Resource: !Sub 'arn:${AWS::Partition}:ssm:${solutionAccountRegion}:${solutionInstalledAccount}:document/*'
                    # Instances: deliberately unscoped. Which instance is under
                    # investigation is not known until a finding arrives, and an
                    # incident is exactly when the solution must not be blocked
                    # by a policy that predates it. The document scope above is
                    # what bounds this: the role can run only forensic documents,
                    # and only on instances, so the blast radius is "collect
                    # evidence from any instance", not "run anything anywhere".
                    - Sid: OnAnyInstanceUnderInvestigation
                      Action:
                          - 'ssm:SendCommand'
                          - 'ssm:CancelCommand'
                      Effect: Allow
                      Resource: !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*'
                Version: '2012-10-17'
            PolicyName: ForensicCrossAccountSSMRunPolicy
            Roles:
                - Ref: ForensicCrossAccountRole256E0D71
